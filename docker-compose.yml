services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trmnl-family-calendar-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    ports:
      - "${BACKEND_PORT:-8902}:8080"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: trmnl-family-calendar-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  redis_data:
