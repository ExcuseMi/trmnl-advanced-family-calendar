custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: A smart-scaling agenda from any ICS calendar feed, where the timeline auto-expands the hours that matter (daylight and your meetings) and shrinks the quiet ones, so your day never gets squeezed into a tiny sliver of the screen. Combine multiple calendars, each shown in its own color, with sunrise/sunset and daily weather right alongside your events. 1 day to a week of coverage. Auto-detects your language and time format from your TRMNL account.<br /><br />Runs on TRMNL <strong>Serverless</strong>, no server to host.
  github_url: https://github.com/ExcuseMi/trmnl-daylight-ics-calendar-plugin
  category: calendar
  help_text: TRMNL X Ready
- keyname: calendars
  field_type: code
  name: Calendar Configuration
  description: One JSON object describing the hours you want shown, your calendars, and (optionally) the people and categories you want events colored/labeled/iconed by. Most calendar apps have a private ICS link tucked away in settings, e.g. Nextcloud (Calendar → hover a calendar → ⋯ → <strong>Copy private link</strong>) or Google Calendar (Settings → your calendar → <strong>Secret address in iCal format</strong>). <code>webcal://</code> links work too.<br /><br />Build and test this with real ICS data at <a href="https://excusemi.github.io/trmnl-daylight-ics-calendar-plugin/tools/config-editor.html" target="_blank">the Calendar Configuration Editor</a> rather than hand-writing it — paste the result here (it can also load an existing configuration back in, to keep editing it).<br /><br /><strong>Shape:</strong> <code>hours</code> optional <code>{ start, end }</code> (default 7-21) — the default hour range shown; automatically widened to also cover sunrise, every actual event, and sunset, whichever push earlier/later, so nothing real is ever hidden. Hours left outside the final range are hidden entirely rather than shown compressed.<br /><br /><code>people[]</code> holds ONLY formatting — <code>name</code> (required, also the lookup key used below), <code>color</code> (optional), <code>badge</code> (optional short text for the small circle next to an event, defaults to <code>name</code>'s first letter). Which events belong to a person is entirely a property of the calendar they're on&#58;<br /><code>calendars[].url</code> required. <code>calendars[].id</code> optional short label, referenced by <code>personRules[].person</code>/<code>defaultPerson</code> below — a calendar without one can still be referenced by its <code>url</code> instead. <code>calendars[].color</code> optional, pins that calendar's own default color instead of auto-assigning by position (a matched/defaulted person's color still wins over this). <code>calendars[].icon</code> optional — a default icon (same shape as a category's, see below) for every event on that calendar; a matching Category's icon still wins over this. Handy for a calendar that's already entirely "one thing" — e.g. a public holidays feed pinned to a flag icon; the Configuration Editor has a one-click "Add public holidays" picker (pick your country, it fills in a real Google-hosted holiday ICS URL with color/icon already set) rather than needing to hand-write this. <code>calendars[].exclude</code> optional — a regex, or an array of them (case-insensitive, any match hides the event) — events matching hidden entirely, only from that calendar, before people are ever applied.<br /><code>calendars[].personRules</code> optional array of <code>{ match, person, rename }</code> — <code>match</code> (regex) tested against every surviving event on THAT calendar, in order (a later rule's rename builds on an earlier one's output, last match wins for color/badge); <code>person</code> is who it belongs to (doesn't need to already exist in <code>people[]</code>, but only a declared one contributes color/badge); <code>rename</code> (default true) controls whether the matched text becomes <code>person</code>'s name — set it false to tag/color without renaming.<br /><code>calendars[].defaultPerson</code> optional — applied when no <code>personRules</code> matched, e.g. for a calendar that's already entirely one person's own.<br /><br /><strong>categories[]</strong> — every event on screen gets a small color bar down its left edge; a category is how you give that bar (and the badge circle) meaning. Unlike <code>people[]</code>, a category isn't scoped to one calendar — it's tested against every event's title, from any calendar, so e.g. "Birthday" can catch a birthday on any of your calendars at once. Each entry&#58; <code>name</code> (optional, just a label for your own reference), <code>match</code> (required — a regex, or an array of them, case-insensitive, any match applies; checked in array order, later matches win), <code>icon</code> (optional — the icon replaces the person-badge letter in the same corner circle; see below), <code>color</code> (optional, overrides the event's calendar/person color — same list as above). A color-only category just recolors the bar/chip; an icon-only category just swaps the badge.<br /><br /><strong>Icons</strong> reference <a href="https://fonts.google.com/icons?icon.set=Material+Symbols" target="_blank">Google's Material Symbols (Outlined)</a> icon set by plain name, e.g. <code>"icon"&#58; "cake"</code> — find a name by browsing that page (the name is shown under each icon; use underscores for multi-word names, e.g. <code>directions_car</code>). The Configuration Editor's icon picker searches and previews these live, no need to guess spellings. A full <code>http(s)://</code> URL works too, for a custom/self-hosted icon image. <code>icon</code> can also be an array of up to two names/URLs, shown as two small overlapping badge circles — e.g. <code>"icon"&#58; ["work", "home"]</code> for a "Work From Home" category.<br /><br />Colors are one of&#58; <code>red</code>, <code>orange</code>, <code>yellow</code>, <code>lime</code>, <code>green</code>, <code>cyan</code>, <code>blue</code>, <code>violet</code>, <code>purple</code>, <code>pink</code>, or an explicit gray shade&#58; <code>gray-10</code> (darkest) through <code>gray-70</code> (lightest) in steps of 5.
  placeholder: |-
    {
      "hours": { "start": 7, "end": 21 },
      "calendars": [
        { "id": "Alex", "url": "https://cloud.example.com/alex.ics", "defaultPerson": "Alex" },
        {
          "id": "School", "url": "https://cloud.example.com/school.ics",
          "exclude": ["\\bL[1345]\\b", "\\bK[123]\\b"],
          "personRules": [
            { "match": "\\bL6\\b", "person": "Alex" }
          ]
        },
        {
          "id": "Holidays",
          "url": "https://calendar.google.com/calendar/ical/en.usa%23holiday%40group.v.calendar.google.com/public/basic.ics",
          "color": "red", "icon": "flag"
        }
      ],
      "people": [
        { "name": "Alex", "color": "pink", "badge": "K" }
      ],
      "categories": [
        { "name": "Birthday", "match": "verjaardag|birthday", "icon": "cake" },
        { "name": "Work From Home", "match": "\\bWFH\\b", "icon": ["work", "home"] }
      ]
    }
- keyname: view_days
  field_type: select
  name: Days to Show
  description: How many days the calendar grid covers, starting today.
  options:
  - 1 day: '1'
  - 2 days: '2'
  - 3 days: '3'
  - 5 days: '5'
  - 1 week: '7'
  default: '3'
- keyname: lat_lon
  field_type: lat_lon
  name: Location (for sunrise/sunset)
  description: Search a city, address, or postal code and pick a match, or enter coordinates directly. Also used to decide which hours of the grid get emphasized (daylight hours, expanded, are shown alongside your actual meetings). Leave blank to hide sun times and emphasize by meetings alone.
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  description: Used for the daily high/low shown under each day (requires Location above).
  options:
  - Celsius (°C): celsius
  - Fahrenheit (°F): fahrenheit
  default: celsius
- keyname: time_format
  field_type: select
  name: Time Format
  description: How event and sun times are displayed.
  options:
  - 24-hour (14:30): 24h
  - 12-hour (2:30 PM): 12h
  default: 24h
- keyname: time_zone
  field_type: time_zone
  name: Time Zone
  description: Days and event times are computed in this zone. Leave blank to use your TRMNL account's own time zone.
  optional: true
- keyname: show_title_bar
  field_type: boolean
  name: Title Bar
  description: Shows a bar with this plugin instance's name across the top of the screen. Off by default to leave more room for the calendar grid.
  default: 'false'
name: Daylight & Weather Calendar
description: ''
refresh_interval: 15
