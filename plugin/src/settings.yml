---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: node
polling_url: ''
polling_headers: ''
polling_body: ''
id: 467724
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: A smart-scaling agenda from any ICS calendar feed. Combine multiple calendars, each in its own color, with sunrise/sunset and daily weather. 1 to 3 days of coverage.<br /><br />Runs on TRMNL <strong>Serverless</strong>.<br /><br />Icon by Solar Icons, CC Attribution.<br /><br />Weather by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a>.
  github_url: https://github.com/ExcuseMi/trmnl-family-calendar
  category: calendar
  help_text: TRMNL X Ready
- keyname: calendars
  field_type: code
  name: Calendar Configuration
  description: Your calendars (ICS links) and optionally people, as JSON.<br /><br />Build it with <a href="https://excusemi.github.io/trmnl-family-calendar/tools/config-editor.html" target="_blank">the Configuration Editor</a> — paste the result here. Reference docs — <a href="https://github.com/ExcuseMi/trmnl-family-calendar/blob/main/CONFIG.md" target="_blank">CONFIG.md</a> (or <a href="https://github.com/ExcuseMi/trmnl-family-calendar/blob/main/LLM.md" target="_blank">LLM.md</a> for an LLM to read).
  placeholder: |-
    {
      "calendars": [
        { "id": "Alex", "url": "https://cloud.example.com/alex.ics", "defaultPerson": "Alex" },
        {
          "id": "School", "url": "https://cloud.example.com/school.ics",
          "exclude": ["\\bL[1345]\\b", "\\bK[123]\\b"],
          "personRules": [
            { "match": "\\bL6\\b", "person": "Alex" }
          ]
        },
        {
          "id": "Holidays",
          "url": "https://calendar.google.com/calendar/ical/en.usa%23holiday%40group.v.calendar.google.com/public/basic.ics",
          "color": "red"
        }
      ],
      "people": [
        { "name": "Alex", "color": "pink", "badge": "K" }
      ]
    }
- keyname: view_days
  field_type: select
  name: Days to Show
  description: Days shown, starting today. Full-size layout only. Quadrant/half always show just today.
  options:
  - 1 day: '1'
  - 2 days: '2'
  - 3 days: '3'
  default: '3'
- keyname: lat_lon
  field_type: lat_lon
  name: Location (for sunrise/sunset and weather)
  description: Drives sunrise/sunset shading, daily weather, and which hours get emphasized. Leave blank to hide all three.
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  description: For the daily high/low (requires Location).
  options:
  - Celsius (°C): celsius
  - Fahrenheit (°F): fahrenheit
  default: celsius
- keyname: time_format
  field_type: select
  name: Time Format
  description: How event and sun times are displayed.
  options:
  - 24-hour (14:30): 24h
  - 12-hour (2:30 PM): 12h
  default: 24h
- keyname: hours
  field_type: string
  name: Visible Hours
  description: Default hour range, as "start-end" (e.g. "7-21"). Always widens to fit real events/sunrise/sunset. Blank = 7-21.
  placeholder: 7-21
  optional: true
  group: Advanced
- keyname: time_zone
  field_type: time_zone
  name: Time Zone
  description: Blank = your TRMNL account's own time zone.
  optional: true
  group: Advanced
name: Family Calendar
description: Smart-scaling family agenda
refresh_interval: 15
