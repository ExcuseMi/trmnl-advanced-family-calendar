---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.1
serverless_language: python
polling_url: ''
polling_headers: ''
polling_body: ''
id: 365548
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: A smart-scaling agenda from any ICS calendar feed, where the timeline auto-expands the hours that matter (daylight and your meetings) and shrinks the quiet ones, so your day never gets squeezed into a tiny sliver of the screen. Combine multiple calendars, each shown in its own color, with sunrise/sunset and daily weather right alongside your events. 1 day to a week of coverage. Auto-detects your language and time format from your TRMNL account.<br /><br />Runs on TRMNL <strong>Serverless</strong>, no server to host.
  github_url: https://github.com/ExcuseMi/trmnl-daylight-ics-calendar-plugin
  category: calendar
  help_text: TRMNL X Ready
- keyname: ics_url
  field_type: text
  name: Calendar ICS URLs
  description: One ICS link per line to combine several calendars, each gets its own color, auto-assigned in order unless pinned. Most calendar apps have a private ICS link tucked away in settings, e.g. Nextcloud (Calendar → hover a calendar → ⋯ → <strong>Copy private link</strong>) or Google Calendar (Settings → your calendar → <strong>Secret address in iCal format</strong>). <code>webcal://</code> links work too.<br /><br />To pin a calendar's color instead of auto-assigning it, add <code>| colorname</code> after the link, one of&#58; <code>red</code>, <code>orange</code>, <code>yellow</code>, <code>lime</code>, <code>green</code>, <code>cyan</code>, <code>blue</code>, <code>violet</code>, <code>purple</code>, <code>pink</code>. Example&#58;<br /><code>https://cloud.example.com/family.ics | pink</code>
  placeholder: |-
    https://cloud.example.com/remote.php/dav/public-calendars/TOKEN1/?export
    https://cloud.example.com/remote.php/dav/public-calendars/TOKEN2/?export | pink
- keyname: view_days
  field_type: select
  name: Days to Show
  description: How many days the calendar grid covers, starting today.
  options:
  - 1 day: '1'
  - 2 days: '2'
  - 3 days: '3'
  - 5 days: '5'
  - 1 week: '7'
  default: '3'
- keyname: lat_lon
  field_type: lat_lon
  name: Location (for sunrise/sunset)
  description: Search a city, address, or postal code and pick a match, or enter coordinates directly. Also used to decide which hours of the grid get emphasized (daylight hours, expanded, are shown alongside your actual meetings). Leave blank to hide sun times and emphasize by meetings alone.
  optional: true
- keyname: temperature_unit
  field_type: select
  name: Temperature Unit
  description: Used for the daily high/low shown under each day (requires Location above).
  options:
  - Celsius (°C): celsius
  - Fahrenheit (°F): fahrenheit
  default: celsius
- keyname: time_format
  field_type: select
  name: Time Format
  description: How event and sun times are displayed.
  options:
  - 24-hour (14:30): 24h
  - 12-hour (2:30 PM): 12h
  default: 24h
- keyname: time_zone
  field_type: time_zone
  name: Time Zone
  description: Days and event times are computed in this zone. Leave blank to use your TRMNL account's own time zone.
  optional: true
- keyname: show_title_bar
  field_type: boolean
  name: Title Bar
  description: Shows a bar with this plugin instance's name across the top of the screen. Off by default to leave more room for the calendar grid.
  default: 'false'
- keyname: exclude_regex
  group: Advanced
  field_type: text
  name: Exclude Events (regex)
  description: Hide any event whose title matches this regular expression (case-insensitive). Leave blank to show everything. Example, for a school calendar with titles like <code>L1 - Turnen</code> and <code>L1 + L2 - Sportdag</code> — hide every class's events except L2 and L6, while still keeping school-wide entries with no class code at all&#58; <code>(?=.*\b(?:L[1345]|K[123]|Kleuter)\b)(?!.*\b(?:L2|L6)\b)</code>
  optional: true
- keyname: event_rules
  group: Advanced
  field_type: text
  name: Rename & Recolor Events (regex)
  description: One rule per line&#58; <code>find regex => replacement | color</code>, applied in order (case-insensitive) to every event that survives the Exclude filter above. Both parts after <code>=></code> are optional. Colors are the same 10 names as the Calendar ICS URLs field above.<br /><br /><strong>Rename only</strong> — show a kid's name instead of a class code&#58;<br /><code>\bL6\b => Aiko</code><br /><br /><strong>Recolor only</strong> — leave the replacement blank to color without renaming&#58;<br /><code>\bAiko\b => | pink</code><br /><br /><strong>Both at once</strong> — every "L6" event becomes "Aiko" and turns pink, regardless of which calendar it's on&#58;<br /><code>\bL6\b => Aiko | pink</code>
  optional: true
name: Daylight & Weather Calendar
description: ''
refresh_interval: 15
