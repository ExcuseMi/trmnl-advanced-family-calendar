    events:
    # Chip-rendering dimension matrix — text length x icon count x lane width x box height.
    # Exercises chip_body/fit()'s one-line-vs-wrap logic deliberately, not just whatever
    # combination a real calendar happens to produce. Two "narrow" bands (3 lanes sharing a
    # time slot) cover width; each event's own height_pct covers short vs tall; title covers
    # short vs long text; badges covers 0/1/2 icons.
    #
    # Band A: narrow (3 lanes) x TALL — lane 0 is the exact shape that broke chip_body
    # earlier (short text, 1 icon, narrow, tall: an 8-hour "Work" split into 2 lanes wrapped
    # into "W"/"o"/"r"/"k" at a huge size) — kept here as a standing regression check.
    - top_pct: 2
      height_pct: 20
      lane_index: 0
      nlanes: 3
      title: Gym
      hue: blue-65
      fg: black
      badges: []
      display: text
